<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PD Name That Tune</title>
<style>*{box-sizing:border-box}body{margin:0;background:#050b12;color:#f5f7fa;font-family:Segoe UI,Arial}button,input{font:inherit}.top{padding:16px 20px;background:#07121d;border-bottom:1px solid #25445d}.top b{font-size:20px}.sub{color:#9db0c2;font-size:12px}.layout{max-width:1400px;margin:auto;padding:14px;display:grid;grid-template-columns:240px 1fr 280px;gap:14px}.panel{background:linear-gradient(#0d2234,#081724);border:1px solid #24445f;border-radius:16px;padding:14px}.nav{width:100%;text-align:left;padding:11px;margin:5px 0;border-radius:10px;border:1px solid transparent;background:transparent;color:#fff;cursor:pointer}.nav.on{background:#153a58;border-color:#39739e}.nav.final{margin-top:18px;background:#49320b;border-color:#9b7022;color:#ffe19a;font-weight:900}.main{padding:22px;min-height:600px}.kicker{color:#4db3ff;font-weight:900;font-size:12px;letter-spacing:.14em}h1{margin:7px 0 4px}.card{margin-top:18px;min-height:410px;border:1px solid #24445f;border-radius:16px;background:#071522;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.icon{font-size:70px;color:#ffc857}.timer{font-size:48px;font-weight:900;color:#ffc857}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:15px}.btn{padding:10px 15px;border-radius:10px;border:1px solid #31516a;background:#12304a;color:#fff;font-weight:800;cursor:pointer}.red{background:#682323}.gold{background:#70500e}.answer{display:none;margin-top:18px;padding:14px 22px;background:#0d2c20;border:1px solid #427453;border-radius:12px}.answer.show{display:block}.answer b{font-size:22px;color:#6be5a7}.team{border:1px solid #24445f;background:#091a29;border-radius:11px;padding:9px;margin:8px 0}.team input{width:100%;background:transparent;border:0;border-bottom:1px solid #35536c;color:#fff;font-weight:800}.pts{text-align:center;font-size:30px;font-weight:900;margin:7px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.score button{background:#102a40;color:#fff;border:1px solid #31516a;border-radius:7px;padding:7px}.rules{display:none;background:#3c2a09;color:#ffe6a4;border-radius:10px;padding:12px;margin:12px 0;font-weight:700}.finale .rules{display:block}.finale .main{background:linear-gradient(#251a08,#0d0a06);border-color:#a47725}.finale .card{background:#171006;border-color:#9c7226}.muted{color:#9db0c2;font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}}</style></head>
<body><div class="top"><b>ONESTATE RP • PD NAME THAT TUNE</b><div class="sub">RERUN • 25 NEW SONGS • FINISH THE LYRIC FINAL • NO SHUFFLE</div></div><div class="layout">
<nav class="panel"><div class="sub">ROUNDS</div><div id="nav"></div><button class="nav final" id="final">🏆 FINISH THE LYRIC</button></nav>
<section class="panel main"><div class="kicker" id="kick"></div><h1 id="title"></h1><div class="rules">Winning team only • Song and artist are shown • Listen until the audio CUTS DEAD • Continue the words that come next • 4/5 wins</div><div class="card"><div class="muted" id="track"></div><div class="icon">♫</div><p class="muted" id="hint"></p><div class="timer" id="timer"></div><div class="actions"><button class="btn" id="play">▶ PLAY</button><button class="btn red" id="stop">■ STOP</button><button class="btn gold" id="reveal">REVEAL SONG</button></div><div class="answer" id="answer"><b id="song"></b><div id="artist"></div></div><div class="actions"><button class="btn" id="prev">← PREVIOUS</button><button class="btn" id="next">NEXT →</button></div></div></section>
<aside class="panel"><div class="sub">TEAM SCOREBOARD</div><div id="teams"></div><p class="muted">Song = 1 • Artist = 1 • Both = 2</p></aside></div><audio id="audio"></audio>
<script>
const rounds=[{"name": "Throwback Warm-Up", "questions": [{"song": "Wake Me Up Before You Go-Go", "artist": "Wham!", "src": "music/01.mp3"}, {"song": "Girls Just Want to Have Fun", "artist": "Cyndi Lauper", "src": "music/02.mp3"}, {"song": "Footloose", "artist": "Kenny Loggins", "src": "music/03.mp3"}, {"song": "You Spin Me Round", "artist": "Dead or Alive", "src": "music/04.mp3"}, {"song": "Walking on Sunshine", "artist": "Katrina and the Waves", "src": "music/05.mp3"}]}, {"name": "2000s Throwbacks", "questions": [{"song": "Since U Been Gone", "artist": "Kelly Clarkson", "src": "music/06.mp3"}, {"song": "Complicated", "artist": "Avril Lavigne", "src": "music/07.mp3"}, {"song": "Dynamite", "artist": "Taio Cruz", "src": "music/08.mp3"}, {"song": "Low", "artist": "Flo Rida feat. T-Pain", "src": "music/09.mp3"}, {"song": "Just Dance", "artist": "Lady Gaga feat. Colby O'Donis", "src": "music/10.mp3"}]}, {"name": "Party Anthems", "questions": [{"song": "Party in the U.S.A.", "artist": "Miley Cyrus", "src": "music/11.mp3"}, {"song": "DJ Got Us Fallin' in Love", "artist": "Usher feat. Pitbull", "src": "music/12.mp3"}, {"song": "Club Can't Handle Me", "artist": "Flo Rida feat. David Guetta", "src": "music/13.mp3"}, {"song": "Tik Tok", "artist": "Kesha", "src": "music/14.mp3"}, {"song": "California Gurls", "artist": "Katy Perry feat. Snoop Dogg", "src": "music/15.mp3"}]}, {"name": "R&B & Hip-Hop", "questions": [{"song": "Return of the Mack", "artist": "Mark Morrison", "src": "music/16.mp3"}, {"song": "The Boy Is Mine", "artist": "Brandy & Monica", "src": "music/17.mp3"}, {"song": "Dilemma", "artist": "Nelly feat. Kelly Rowland", "src": "music/18.mp3"}, {"song": "Bust a Move", "artist": "Young MC", "src": "music/19.mp3"}, {"song": "Family Affair", "artist": "Mary J. Blige", "src": "music/20.mp3"}]}, {"name": "Modern Hits", "questions": [{"song": "Levitating", "artist": "Dua Lipa", "src": "music/21.mp3"}, {"song": "As It Was", "artist": "Harry Styles", "src": "music/22.mp3"}, {"song": "Espresso", "artist": "Sabrina Carpenter", "src": "music/23.mp3"}, {"song": "Good 4 U", "artist": "Olivia Rodrigo", "src": "music/24.mp3"}, {"song": "Watermelon Sugar", "artist": "Harry Styles", "src": "music/25.mp3"}]}],finals=[{"song": "Teenage Dirtbag", "artist": "Wheatus", "src": "music/26.mp3"}, {"song": "Valerie", "artist": "Amy Winehouse", "src": "music/27.mp3"}, {"song": "Somebody Told Me", "artist": "The Killers", "src": "music/28.mp3"}, {"song": "Price Tag", "artist": "Jessie J feat. B.o.B", "src": "music/29.mp3"}, {"song": "Shut Up and Dance", "artist": "WALK THE MOON", "src": "music/30.mp3"}];let r=0,q=0,f=false,ti,to;const $=x=>document.getElementById(x),scores=[0,0,0,0];
function score(i,n){scores[i]=Math.max(0,scores[i]+n);$("p"+i).textContent=scores[i]}
function drawTeams(){$("teams").innerHTML=scores.map((x,i)=>`<div class="team"><input value="Team ${i+1}"><div class="pts" id="p${i}">${x}</div><div class="score"><button onclick="score(${i},-1)">−1</button><button onclick="score(${i},1)">+1</button><button onclick="score(${i},2)">+2</button></div></div>`).join("")}
function drawNav(){$("nav").innerHTML=rounds.map((x,i)=>`<button class="nav ${!f&&i===r?'on':''}" onclick="go(${i})">Round ${i+1}<div class="muted">${x.name}</div></button>`).join("")}
function cur(){return f?finals[q]:rounds[r].questions[q]}
function stop(){clearInterval(ti);clearTimeout(to);$("audio").pause()}
function render(){stop();document.body.classList.toggle("finale",f);let x=cur(),s=f?14:10;$("kick").textContent=f?"BIG-PRIZE FINAL":`ROUND ${r+1} OF 5`;$("title").textContent=f?"Finish the Lyric":rounds[r].name;$("track").textContent=`${f?"CHALLENGE":"TRACK"} ${q+1} OF 5`;$("hint").textContent=f?"SONG IS SHOWN BELOW. Press PLAY. When it cuts dead, they must continue the lyric.":"Name the song and artist.";$("timer").textContent=s;$("answer").classList.remove("show");$("song").textContent=x.song;$("artist").textContent=x.artist;
$("reveal").style.display="inline-block";
let old=document.getElementById("judge");if(old)old.remove();
if(f){let j=document.createElement("div");j.id="judge";j.className="actions";j.innerHTML=`<button class="btn" onclick="judge(true)">✓ CORRECT</button><button class="btn red" onclick="judge(false)">✕ WRONG</button><b id="finalscore" style="padding:10px">Final score: ${window.finalCorrect||0}/5</b>`;document.querySelector(".answer").after(j)}
drawNav()}
function go(i){f=false;r=i;q=0;render()}$("final").onclick=()=>{f=true;q=0;render()};
$("play").onclick=()=>{stop();let x=cur(),s=f?14:10,a=$("audio");a.src=x.src;a.currentTime=0;a.play();let n=s;$("timer").textContent=n;ti=setInterval(()=>{$("timer").textContent=--n;if(n<=0)stop()},1000);to=setTimeout(stop,s*1000+100)};
$("stop").onclick=stop;$("reveal").onclick=()=>$("answer").classList.toggle("show");$("prev").onclick=()=>{if(q>0)q--;render()};$("next").onclick=()=>{if(q<4)q++;else if(!f&&r<4){r++;q=0}else if(!f){f=true;q=0}else{alert("FINAL COMPLETE!")}render()};window.finalCorrect=0;window.judged={};
function judge(ok){if(!f)return;if(window.judged[q]!==undefined){if(window.judged[q])window.finalCorrect--;delete window.judged[q]}
window.judged[q]=ok;if(ok)window.finalCorrect++;let el=document.getElementById("finalscore");if(el)el.textContent=`Final score: ${window.finalCorrect}/5`;
if(window.finalCorrect>=4) document.querySelector(".rules").textContent="🏆 4/5 ACHIEVED — BIGGER PRIZE WON!";}
drawTeams();render();
</script></body></html>
